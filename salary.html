<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Зарплата</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --bg: #08080a; --surface: #111114; --surface2: #18181c; --surface3: #1f1f24;
  --border: #27272e; --border2: #35353e;
  --text: #f0f0f5; --text2: #a0a0b0; --muted: #55556a;
  --accent: #00e09e; --accent2: #00c488; --accent-dim: rgba(0,224,158,0.08); --accent-glow: rgba(0,224,158,0.15);
  --red: #ff4d6a; --red-dim: rgba(255,77,106,0.08);
  --blue: #4d8eff; --blue-dim: rgba(77,142,255,0.08);
  --r: 16px; --r2: 24px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100dvh;overflow-x:hidden;position:relative}
body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse 600px 600px at 20% 20%,rgba(0,224,158,0.03) 0%,transparent 70%),radial-gradient(ellipse 400px 400px at 80% 80%,rgba(77,142,255,0.02) 0%,transparent 70%);animation:ambientDrift 20s ease-in-out infinite alternate;pointer-events:none;z-index:0}
@keyframes ambientDrift{0%{transform:translate(0,0) rotate(0deg)}100%{transform:translate(30px,-20px) rotate(3deg)}}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:20px 16px 40px}
.screen{display:none}.screen.active{display:block;animation:screenIn .5s cubic-bezier(.16,1,.3,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.stagger{opacity:0;transform:translateY(16px);animation:staggerIn .6s cubic-bezier(.16,1,.3,1) forwards}
.stagger:nth-child(1){animation-delay:.05s}.stagger:nth-child(2){animation-delay:.1s}.stagger:nth-child(3){animation-delay:.15s}.stagger:nth-child(4){animation-delay:.2s}.stagger:nth-child(5){animation-delay:.25s}.stagger:nth-child(6){animation-delay:.3s}.stagger:nth-child(7){animation-delay:.35s}.stagger:nth-child(8){animation-delay:.4s}
@keyframes staggerIn{to{opacity:1;transform:translateY(0)}}

.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.logo{font-size:15px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.top-right{display:flex;align-items:center;gap:8px}
.user-chip{font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:6px 10px;border-radius:8px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:none}
.settings-btn{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s}
.settings-btn:hover{border-color:var(--border2);color:var(--text2);transform:rotate(30deg)}

.month-nav{display:flex;justify-content:center;align-items:center;gap:20px;margin-bottom:28px}
.month-nav button{width:36px;height:36px;border-radius:50%;background:transparent;border:1px solid var(--border);color:var(--muted);font-size:14px;cursor:pointer;transition:all .3s}
.month-nav button:hover{border-color:var(--accent);color:var(--accent)}.month-nav button:active{transform:scale(.9)}
.month-label{font-size:16px;font-weight:600;color:var(--text2);min-width:150px;text-align:center;letter-spacing:.5px}

.bank-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:28px 24px 24px;margin-bottom:12px;overflow:hidden}
.bank-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.4}
.bank-card::after{content:'';position:absolute;top:-80px;right:-80px;width:200px;height:200px;background:radial-gradient(circle,var(--accent-dim) 0%,transparent 70%);pointer-events:none}
.bank-label{font-size:11px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.bank-amount{font-family:'JetBrains Mono',monospace;font-size:40px;font-weight:600;color:var(--accent);line-height:1;margin-bottom:16px;text-shadow:0 0 40px var(--accent-glow)}
.bank-amount .currency{font-size:22px;font-weight:400;color:var(--accent2);margin-left:4px}
.progress-track{width:100%;height:4px;background:var(--surface3);border-radius:2px;overflow:visible;margin-bottom:8px;position:relative}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:2px;transition:width 1s cubic-bezier(.16,1,.3,1);position:relative}
.progress-bar::after{content:'';position:absolute;right:-4px;top:-2px;width:8px;height:8px;background:var(--accent);border-radius:50%;box-shadow:0 0 12px var(--accent-glow)}
.progress-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace}

.dual-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.metric-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 16px;position:relative;overflow:hidden}
.metric-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;border-radius:0 2px 2px 0}
.metric-card.earned::before{background:var(--accent)}.metric-card.paid::before{background:var(--red)}
.metric-label{font-size:10px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.metric-value{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:600}
.metric-value.green{color:var(--accent)}.metric-value.red{color:var(--red)}

.rates-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.rate-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 10px;text-align:center;transition:all .3s}
.rate-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.rate-value{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500;color:var(--blue);margin-bottom:4px}
.rate-unit{font-size:10px;color:var(--muted);letter-spacing:1px}

.live-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:20px;text-align:center;margin-bottom:16px;position:relative;overflow:hidden}
.live-card::before{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--blue),transparent);opacity:.3}
.live-dot{display:inline-block;width:6px;height:6px;background:var(--red);border-radius:50%;margin-right:6px;animation:livePulse 1.5s ease-in-out infinite;vertical-align:middle}
@keyframes livePulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(255,77,106,.4)}50%{opacity:.6;box-shadow:0 0 0 6px rgba(255,77,106,0)}}
.live-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.live-value{font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:600;color:var(--text)}
.live-value .decimal{color:var(--muted);font-size:22px}.live-value .tenge{color:var(--text2);font-size:20px;font-weight:400;margin-left:4px}

.cta-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--text);font-family:'Outfit',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:all .3s;margin-bottom:16px;letter-spacing:.3px}
.cta-btn:hover{border-color:var(--accent);background:var(--accent-dim)}.cta-btn:active{transform:scale(.98)}
.cta-icon{width:32px;height:32px;border-radius:8px;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;font-size:16px}

.payments-section{margin-top:8px}.section-title{font-size:11px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;padding-left:4px}
.payment-item{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:6px;transition:all .3s;animation:paymentIn .4s cubic-bezier(.16,1,.3,1)}
@keyframes paymentIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.payment-item:hover{border-color:var(--border2)}
.payment-left{display:flex;flex-direction:column;gap:2px}.payment-date{font-size:13px;color:var(--text2);font-weight:500}.payment-comment{font-size:11px;color:var(--muted)}
.payment-right{display:flex;align-items:center;gap:10px}.payment-amount{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;color:var(--red)}
.del-btn{width:28px;height:28px;border-radius:8px;background:transparent;border:1px solid transparent;color:var(--muted);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.del-btn:hover{border-color:var(--red);color:var(--red);background:var(--red-dim)}

.form-header{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.back-btn{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--text2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.back-btn:hover{border-color:var(--border2)}
.form-title{font-size:18px;font-weight:600;letter-spacing:.3px}
.form-group{margin-bottom:16px}.form-label{font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:block}
.form-input{width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);font-family:'Outfit',sans-serif;font-size:16px;transition:all .3s;outline:none}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}.form-input::placeholder{color:var(--muted)}
.submit-btn{width:100%;padding:16px;border:none;border-radius:12px;background:var(--accent);color:var(--bg);font-family:'Outfit',sans-serif;font-size:16px;font-weight:600;cursor:pointer;transition:all .3s;letter-spacing:.5px}
.submit-btn:hover{background:var(--accent2)}.submit-btn:active{transform:scale(.98)}
.cancel-btn{width:100%;padding:14px;border:1px solid var(--border);border-radius:12px;background:transparent;color:var(--text2);font-family:'Outfit',sans-serif;font-size:15px;font-weight:500;cursor:pointer;margin-top:8px;transition:all .2s}
.cancel-btn:hover{border-color:var(--border2)}
.danger-btn{width:100%;padding:12px;border:1px solid rgba(255,77,106,.2);border-radius:12px;background:var(--red-dim);color:var(--red);font-family:'Outfit',sans-serif;font-size:14px;font-weight:500;cursor:pointer;margin-top:16px;transition:all .2s}
.danger-btn:hover{border-color:var(--red)}
.settings-row{margin-bottom:16px}

/* AUTH */
.login-center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80dvh;text-align:center}
.login-logo{font-size:24px;font-weight:800;letter-spacing:6px;color:var(--text);margin-bottom:8px}
.login-sub{font-size:14px;color:var(--muted);margin-bottom:28px}
.auth-form{width:100%;max-width:300px}
.auth-input{width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);font-family:'Outfit',sans-serif;font-size:15px;outline:none;transition:all .3s;margin-bottom:10px}
.auth-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.auth-input::placeholder{color:var(--muted)}
.auth-btn{width:100%;padding:16px;border:none;border-radius:12px;background:var(--accent);color:var(--bg);font-family:'Outfit',sans-serif;font-size:16px;font-weight:600;cursor:pointer;transition:all .3s;margin-bottom:10px}
.auth-btn:hover{background:var(--accent2)}.auth-btn:active{transform:scale(.98)}.auth-btn:disabled{opacity:.4;cursor:not-allowed}
.auth-error{font-size:12px;color:var(--red);margin-bottom:10px;min-height:16px;text-align:center}
.auth-toggle{font-size:12px;color:var(--muted);cursor:pointer;text-align:center}.auth-toggle span{color:var(--accent);font-weight:600}
.login-note{margin-top:16px;font-size:11px;color:var(--muted);text-align:center}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:12px 24px;border-radius:12px;font-size:14px;font-weight:500;z-index:999;opacity:0;transition:all .4s cubic-bezier(.16,1,.3,1);pointer-events:none;backdrop-filter:blur(20px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.error{border-color:rgba(255,77,106,.3)}.toast.success{border-color:rgba(0,224,158,.3)}
@keyframes numberTick{0%{transform:translateY(-4px);opacity:.5}100%{transform:translateY(0);opacity:1}}.tick{animation:numberTick .15s ease-out}
</style>
</head>
<body>
<div class="app">

<!-- LOGIN -->
<div id="screen-login" class="screen active">
  <div class="login-center">
    <div class="login-logo">ЛЕОНОВ</div>
    <div class="login-sub">Трекер заработка и выплат</div>
    <div class="auth-form">
      <div class="auth-error" id="authError"></div>
      <input type="email" class="auth-input" id="authEmail" placeholder="Email" autocomplete="email">
      <input type="password" class="auth-input" id="authPass" placeholder="Пароль" autocomplete="current-password">
      <button class="auth-btn" id="authBtn" onclick="doAuth()">Войти</button>
      <div class="auth-toggle" id="authToggle" onclick="toggleAuthMode()">Нет аккаунта? <span>Создать</span></div>
    </div>
    <div class="login-note">Сессия сохраняется. Входить нужно один раз.</div>
  </div>
</div>

<!-- MAIN -->
<div id="screen-main" class="screen">
  <div class="top-bar stagger">
    <div class="logo">ЛЕОНОВ</div>
    <div class="top-right">
      <span class="user-chip" id="userChip"></span>
      <button class="settings-btn" onclick="showScreen('settings')">⚙</button>
    </div>
  </div>
  <div class="month-nav stagger">
    <button onclick="changeMonth(-1)">←</button>
    <span class="month-label" id="monthLabel"></span>
    <button onclick="changeMonth(1)">→</button>
  </div>
  <div class="bank-card stagger">
    <div class="bank-label">Твой банк</div>
    <div class="bank-amount" id="bankAmount">0<span class="currency">₸</span></div>
    <div class="progress-track"><div class="progress-bar" id="progressFill" style="width:0%"></div></div>
    <div class="progress-labels"><span>0</span><span id="salaryTotal">650 000</span></div>
  </div>
  <div class="dual-row stagger">
    <div class="metric-card earned"><div class="metric-label">Заработано</div><div class="metric-value green" id="earnedAmount">0 ₸</div></div>
    <div class="metric-card paid"><div class="metric-label">Выплачено</div><div class="metric-value red" id="paidAmount">0 ₸</div></div>
  </div>
  <div class="rates-row stagger">
    <div class="rate-card"><div class="rate-value" id="perHour">0</div><div class="rate-unit">₸ / час</div></div>
    <div class="rate-card"><div class="rate-value" id="perMin">0</div><div class="rate-unit">₸ / мин</div></div>
    <div class="rate-card"><div class="rate-value" id="perSec">0</div><div class="rate-unit">₸ / сек</div></div>
  </div>
  <div class="live-card stagger"><div class="live-label"><span class="live-dot"></span>Сегодня live</div><div class="live-value" id="liveCounter">0<span class="decimal">.00</span><span class="tenge">₸</span></div></div>
  <button class="cta-btn stagger" onclick="showScreen('add')"><span class="cta-icon">+</span>Записать выплату</button>
  <div class="payments-section stagger" id="paymentsSection" style="display:none"><div class="section-title">Выплаты</div><div id="paymentsList"></div></div>
</div>

<!-- SETTINGS -->
<div id="screen-settings" class="screen">
  <div class="form-header stagger"><button class="back-btn" onclick="showScreen('main')">←</button><span class="form-title">Настройки</span></div>
  <div class="stagger">
    <div class="settings-row"><label class="form-label">Зарплата в месяц</label><input type="number" class="form-input" id="settSalary"></div>
    <div class="settings-row"><label class="form-label">Дней в месяце</label><input type="number" class="form-input" id="settDays"></div>
    <button class="submit-btn" onclick="saveSettings()">Сохранить</button>
    <button class="cancel-btn" onclick="showScreen('main')">Назад</button>
    <button class="danger-btn" onclick="doSignOut()">Выйти из аккаунта</button>
  </div>
</div>

<!-- ADD PAYMENT -->
<div id="screen-add" class="screen">
  <div class="form-header stagger"><button class="back-btn" onclick="showScreen('main')">←</button><span class="form-title">Записать выплату</span></div>
  <div class="stagger">
    <div class="form-group"><label class="form-label">Дата</label><input type="date" class="form-input" id="addDate"></div>
    <div class="form-group"><label class="form-label">Сумма</label><input type="number" class="form-input" id="addAmount" placeholder="100 000"></div>
    <div class="form-group"><label class="form-label">Комментарий</label><input type="text" class="form-input" id="addComment" placeholder="Необязательно"></div>
    <button class="submit-btn" onclick="addPayment()">Записать</button>
    <button class="cancel-btn" onclick="showScreen('main')">Отмена</button>
  </div>
</div>

</div>
<div class="toast" id="toast"></div>

<script>
const SB_URL='https://vsmqzdyzjcczrogwptsq.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzbXF6ZHl6amNjenJvZ3dwdHNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NDU3NDUsImV4cCI6MjA4ODAyMTc0NX0.qHqNNxQyzKrBbtarlLD3BKjykt9jbcW5h4UoZGF5TY8';
const sb=supabase.createClient(SB_URL,SB_KEY);

let userId=null, authMode='login';
let salary=parseInt(localStorage.getItem('salary_amount')||'650000');
let daysInMonth=parseInt(localStorage.getItem('salary_days')||'30');
let payments=[];
let viewYear,viewMonth;
let liveInterval=null,lastLiveWhole=-1;
const MONTHS_RU=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

// ==================== AUTH ====================
function toggleAuthMode(){
  authMode=authMode==='login'?'signup':'login';
  document.getElementById('authBtn').textContent=authMode==='login'?'Войти':'Создать аккаунт';
  document.getElementById('authToggle').innerHTML=authMode==='login'?'Нет аккаунта? <span>Создать</span>':'Уже есть аккаунт? <span>Войти</span>';
  document.getElementById('authError').textContent='';
}
async function doAuth(){
  const email=document.getElementById('authEmail').value.trim(),pass=document.getElementById('authPass').value;
  const err=document.getElementById('authError'),btn=document.getElementById('authBtn');
  err.textContent='';
  if(!email||!pass){err.textContent='Заполни email и пароль';return;}
  if(pass.length<6){err.textContent='Пароль минимум 6 символов';return;}
  btn.disabled=true;btn.textContent='Подожди...';
  try{
    let res;
    if(authMode==='login')res=await sb.auth.signInWithPassword({email,password:pass});
    else res=await sb.auth.signUp({email,password:pass});
    if(res.error){let m=res.error.message;if(m.includes('Invalid login'))m='Неверный email или пароль';if(m.includes('already registered'))m='Email уже зарегистрирован';err.textContent=m;}
    else if(authMode==='signup'&&res.data?.user&&!res.data.session){err.style.color='var(--accent)';err.textContent='Проверь почту';}
  }catch(e){err.textContent='Ошибка подключения';}
  btn.disabled=false;btn.textContent=authMode==='login'?'Войти':'Создать аккаунт';
}
async function doSignOut(){await sb.auth.signOut();showScreen('login');}

// ==================== INIT ====================
const now=new Date();viewYear=now.getFullYear();viewMonth=now.getMonth();

(async()=>{
  const{data:{session}}=await sb.auth.getSession();
  if(session){userId=session.user.id;await onSignedIn(session.user);}
  else showScreen('login');
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='SIGNED_IN'&&session){userId=session.user.id;onSignedIn(session.user);}
    if(ev==='SIGNED_OUT'){userId=null;showScreen('login');}
  });
})();

async function onSignedIn(user){
  document.getElementById('userChip').textContent=user.email||'';
  document.getElementById('userChip').style.display='block';
  await loadData();
  showScreen('main');
}

// ==================== SCREENS ====================
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.querySelectorAll('.screen.active .stagger').forEach(s=>{s.style.animation='none';s.offsetHeight;s.style.animation='';});
  if(name==='settings'){document.getElementById('settSalary').value=salary;document.getElementById('settDays').value=daysInMonth;}
  if(name==='add'){document.getElementById('addDate').value=new Date().toISOString().slice(0,10);document.getElementById('addAmount').value='';document.getElementById('addComment').value='';}
  if(name==='main'){updateUI();startLive();}else stopLive();
}

function saveSettings(){
  salary=parseInt(document.getElementById('settSalary').value)||650000;
  daysInMonth=parseInt(document.getElementById('settDays').value)||30;
  localStorage.setItem('salary_amount',salary);
  localStorage.setItem('salary_days',daysInMonth);
  showScreen('main');toast('Сохранено','success');
}

// ==================== DATA ====================
async function loadData(){
  payments=[];
  const{data,error}=await sb.from('salary_payments').select('*').eq('user_id',userId);
  if(data)data.forEach(r=>{
    const d=parseDate(r.date);
    if(d)payments.push({id:r.id,date:d,amount:r.amount,comment:r.comment||''});
  });
  updateUI();
}

async function addPayment(){
  const dateVal=document.getElementById('addDate').value;
  const amount=parseInt(document.getElementById('addAmount').value);
  const comment=document.getElementById('addComment').value.trim();
  if(!dateVal){toast('Укажи дату','error');return;}
  if(!amount||amount<=0){toast('Укажи сумму','error');return;}
  const parts=dateVal.split('-');
  const dateFormatted=parts[2]+'.'+parts[1]+'.'+parts[0];
  const{error}=await sb.from('salary_payments').insert({user_id:userId,date:dateFormatted,amount,comment});
  if(error){toast('Ошибка записи','error');return;}
  toast('Записано','success');
  showScreen('main');
  await loadData();
}

async function deletePayment(id){
  if(!confirm('Удалить эту выплату?'))return;
  await sb.from('salary_payments').delete().eq('id',id);
  toast('Удалено','success');
  await loadData();
}

// ==================== MONTH NAV ====================
function changeMonth(dir){viewMonth+=dir;if(viewMonth>11){viewMonth=0;viewYear++;}if(viewMonth<0){viewMonth=11;viewYear--;}updateUI();}

// ==================== UPDATE UI ====================
function updateUI(){
  document.getElementById('monthLabel').textContent=MONTHS_RU[viewMonth]+' '+viewYear;
  const now=new Date();
  const isCurrentMonth=(viewYear===now.getFullYear()&&viewMonth===now.getMonth());
  const isPast=viewYear<now.getFullYear()||(viewYear===now.getFullYear()&&viewMonth<now.getMonth());
  let daysElapsed;
  if(isCurrentMonth){const d=now.getDate(),h=now.getHours(),m=now.getMinutes(),s=now.getSeconds();daysElapsed=(d-1)+(h*3600+m*60+s)/86400;}
  else if(isPast)daysElapsed=daysInMonth;
  else daysElapsed=0;

  const perDay=salary/daysInMonth;
  const earned=Math.floor(perDay*daysElapsed);
  const monthPayments=payments.filter(p=>p.date.getFullYear()===viewYear&&p.date.getMonth()===viewMonth);
  const totalPaid=monthPayments.reduce((s,p)=>s+p.amount,0);
  const bank=Math.max(0,earned-totalPaid);

  document.getElementById('bankAmount').innerHTML=formatMoney(bank)+'<span class="currency">₸</span>';
  document.getElementById('earnedAmount').textContent=formatMoney(earned)+' ₸';
  document.getElementById('paidAmount').textContent=formatMoney(totalPaid)+' ₸';
  document.getElementById('salaryTotal').textContent=formatMoney(salary);
  document.getElementById('progressFill').style.width=Math.min(100,(earned/salary)*100)+'%';
  document.getElementById('perHour').textContent=formatMoney(Math.round(perDay/24));
  document.getElementById('perMin').textContent=formatMoney(Math.round(perDay/1440));
  document.getElementById('perSec').textContent=(perDay/86400).toFixed(2);

  const section=document.getElementById('paymentsSection'),list=document.getElementById('paymentsList');
  if(monthPayments.length>0){
    section.style.display='block';
    list.innerHTML=monthPayments.sort((a,b)=>b.date-a.date).map(p=>`
      <div class="payment-item"><div class="payment-left"><div class="payment-date">${formatDateShort(p.date)}</div>${p.comment?'<div class="payment-comment">'+esc(p.comment)+'</div>':''}</div>
      <div class="payment-right"><span class="payment-amount">−${formatMoney(p.amount)} ₸</span><button class="del-btn" onclick="deletePayment(${p.id})">✕</button></div></div>`).join('');
  }else section.style.display='none';
}

// ==================== LIVE ====================
function startLive(){stopLive();lastLiveWhole=-1;updateLive();liveInterval=setInterval(updateLive,100);}
function stopLive(){if(liveInterval){clearInterval(liveInterval);liveInterval=null;}}
function updateLive(){
  const now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const secs=(now-start)/1000,val=(salary/daysInMonth)/86400*secs;
  const whole=Math.floor(val),dec=(val-whole).toFixed(2).slice(2);
  const el=document.getElementById('liveCounter'),cls=whole!==lastLiveWhole?' tick':'';
  el.innerHTML=formatMoney(whole)+'<span class="decimal'+cls+'">.'+dec+'</span><span class="tenge">₸</span>';
  lastLiveWhole=whole;
}

// ==================== HELPERS ====================
function formatMoney(n){return Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
function formatDateShort(d){return d.getDate()+' '+['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'][d.getMonth()];}
function parseDate(s){if(!s)return null;if(s.includes('.')){const p=s.split('.');if(p.length===3)return new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));}const d=new Date(s);return isNaN(d.getTime())?null:d;}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(type?' '+type:'');setTimeout(()=>t.className='toast',2500);}
</script>
