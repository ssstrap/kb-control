<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ход работ — Королевские бани</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   KB HOD RABOT — PREMIUM UI
   ═══════════════════════════════════════════ */

:root {
  --font: 'Manrope', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
  --day-w: 30px;
  --row-h: 40px;
  --left-w: 400px;
  --head-h: 60px;
}

/* ─── DARK ─── */
[data-theme="dark"] {
  --bg: #050508;
  --surface: rgba(18,18,22,0.85);
  --surface-solid: #121216;
  --surface2: rgba(30,30,36,0.7);
  --surface3: rgba(45,45,54,0.5);
  --border: rgba(255,255,255,0.06);
  --border2: rgba(255,255,255,0.1);
  --border-glow: rgba(48,209,88,0.15);
  --text: #f0f0f5;
  --text2: rgba(240,240,245,0.55);
  --text3: rgba(240,240,245,0.28);
  --accent: #30d158;
  --accent2: #28b74c;
  --accent-dim: rgba(48,209,88,0.12);
  --accent-glow: rgba(48,209,88,0.25);
  --blue: #0a84ff; --orange: #ff9f0a; --red: #ff453a; --purple: #bf5af2;
  --pink: #ff375f; --cyan: #64d2ff; --yellow: #ffd60a; --teal: #30b0c7;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-md: 0 8px 32px rgba(0,0,0,0.5);
  --shadow-lg: 0 16px 64px rgba(0,0,0,0.6);
  --glass: rgba(18,18,22,0.72);
  --gantt-bg: #0a0a0e;
  --gantt-line: rgba(255,255,255,0.03);
  --today-bg: rgba(48,209,88,0.06);
  --weekend-bg: rgba(255,255,255,0.012);
  --section-bg: rgba(20,20,26,0.7);
  --hover: rgba(255,255,255,0.035);
  --selected: rgba(48,209,88,0.07);
  --scrollbar: rgba(255,255,255,0.08);
  --overlay: rgba(0,0,0,0.7);
  --modal-bg: #18181c;
  --input-bg: #0a0a0e;
  --mesh1: radial-gradient(ellipse 600px 400px at 10% 20%, rgba(48,209,88,0.04), transparent);
  --mesh2: radial-gradient(ellipse 500px 500px at 90% 80%, rgba(10,132,255,0.03), transparent);
}

/* ─── LIGHT ─── */
[data-theme="light"] {
  --bg: #f8f8fc;
  --surface: rgba(255,255,255,0.88);
  --surface-solid: #ffffff;
  --surface2: rgba(245,245,250,0.8);
  --surface3: rgba(235,235,242,0.6);
  --border: rgba(0,0,0,0.05);
  --border2: rgba(0,0,0,0.08);
  --border-glow: rgba(52,199,89,0.2);
  --text: #111118;
  --text2: rgba(17,17,24,0.5);
  --text3: rgba(17,17,24,0.25);
  --accent: #28a745;
  --accent2: #1f8c38;
  --accent-dim: rgba(40,167,69,0.1);
  --accent-glow: rgba(40,167,69,0.2);
  --blue: #007aff; --orange: #ff9500; --red: #ff3b30; --purple: #af52de;
  --pink: #ff2d55; --cyan: #32ade6; --yellow: #e6b800; --teal: #5ac8fa;
  --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.1);
  --glass: rgba(255,255,255,0.78);
  --gantt-bg: #f2f2f6;
  --gantt-line: rgba(0,0,0,0.04);
  --today-bg: rgba(40,167,69,0.06);
  --weekend-bg: rgba(0,0,0,0.018);
  --section-bg: rgba(248,248,252,0.9);
  --hover: rgba(0,0,0,0.025);
  --selected: rgba(40,167,69,0.06);
  --scrollbar: rgba(0,0,0,0.1);
  --overlay: rgba(0,0,0,0.25);
  --modal-bg: #ffffff;
  --input-bg: #f2f2f6;
  --mesh1: radial-gradient(ellipse 600px 400px at 10% 20%, rgba(40,167,69,0.03), transparent);
  --mesh2: radial-gradient(ellipse 500px 500px at 90% 80%, rgba(0,122,255,0.02), transparent);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  font-family: var(--font);
  background: var(--bg);
  background-image: var(--mesh1), var(--mesh2);
  background-attachment: fixed;
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.6s var(--ease), color 0.5s var(--ease);
}

/* ═══ ANIMATIONS ═══ */
@keyframes fadeUp { from{opacity:0;transform:translateY(20px) scale(0.98)}to{opacity:1;transform:none} }
@keyframes fadeIn { from{opacity:0}to{opacity:1} }
@keyframes scaleIn { from{opacity:0;transform:scale(0.92) translateY(8px)}to{opacity:1;transform:none} }
@keyframes slideRight { from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none} }
@keyframes slideDown { from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none} }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
@keyframes spin { to{transform:rotate(360deg)} }
@keyframes glow { 0%,100%{box-shadow:0 0 12px var(--accent-glow)}50%{box-shadow:0 0 24px var(--accent-glow)} }
@keyframes shimmer { 0%{background-position:-200% 0}100%{background-position:200% 0} }
@keyframes breathe { 0%,100%{transform:scale(1)}50%{transform:scale(1.02)} }
@keyframes barEnter { from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)} }
@keyframes dotPulse { 0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:0.6} }

/* ═══ HEADER ═══ */
.header {
  height: var(--head-h);
  background: var(--glass);
  backdrop-filter: blur(40px) saturate(200%);
  -webkit-backdrop-filter: blur(40px) saturate(200%);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  position: relative;
  z-index: 100;
  animation: slideDown 0.6s var(--ease-out) both;
}
.header::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 5%;
  right: 5%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-glow), transparent);
}

.header-left { display: flex; align-items: center; gap: 16px; }

.logo {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo-mark {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #000;
  font-size: 13px;
  font-weight: 800;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 12px var(--accent-glow);
  transition: transform 0.3s var(--ease-spring);
}
.logo-mark:hover { transform: rotate(-8deg) scale(1.1); }

.badge {
  font-size: 11px;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 20px;
  background: var(--accent-dim);
  color: var(--accent);
  border: 1px solid var(--border-glow);
  animation: fadeIn 1s var(--ease) 0.3s both;
}

.header-right { display: flex; gap: 8px; align-items: center; }

.btn {
  padding: 8px 16px;
  border-radius: 10px;
  border: 1px solid var(--border2);
  background: var(--surface);
  backdrop-filter: blur(12px);
  color: var(--text);
  font-family: var(--font);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s var(--ease-out);
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  position: relative;
  overflow: hidden;
}
.btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.03));
  pointer-events: none;
}
.btn:hover {
  background: var(--surface2);
  transform: translateY(-2px);
  box-shadow: var(--shadow-sm);
  border-color: var(--border-glow);
}
.btn:active { transform: scale(0.96) translateY(0); }

.btn-accent {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-color: transparent;
  color: #000;
}
.btn-accent:hover {
  filter: brightness(1.15);
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  box-shadow: 0 4px 16px var(--accent-glow);
}

.btn-supa {
  background: linear-gradient(135deg, #3ecf8e, #2b9f6e);
  border-color: transparent;
  color: #000;
}
.btn-supa:hover {
  filter: brightness(1.15);
  background: linear-gradient(135deg, #3ecf8e, #2b9f6e);
  box-shadow: 0 4px 16px rgba(62,207,142,0.3);
}

.theme-toggle {
  width: 36px; height: 36px;
  border-radius: 12px;
  border: 1px solid var(--border2);
  background: var(--surface);
  color: var(--text2);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.4s var(--ease-spring);
}
.theme-toggle:hover { background: var(--surface2); transform: rotate(20deg) scale(1.1); }
.theme-toggle:active { transform: rotate(-20deg) scale(0.9); }

/* ═══ SYNC ═══ */
.sync-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text2);
  padding: 5px 12px;
  border-radius: 20px;
  background: var(--surface2);
  border: 1px solid var(--border);
  transition: all 0.3s var(--ease);
}
.sync-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  transition: background 0.3s;
}
.sync-dot.syncing { animation: dotPulse 1.2s ease-in-out infinite; background: var(--orange); }
.sync-dot.error { background: var(--red); }

/* ═══ STATUS BAR ═══ */
.status-bar {
  height: 38px;
  background: var(--surface);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 20px;
  font-size: 11px;
  color: var(--text2);
  animation: fadeIn 0.8s var(--ease) 0.2s both;
  overflow-x: auto;
}
.status-bar::-webkit-scrollbar { display: none; }
.stat { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.stat-dot { width: 6px; height: 6px; border-radius: 50%; }
.stat-num { font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.stat-divider { width: 1px; height: 16px; background: var(--border2); }

/* ═══ MAIN ═══ */
.main { display: flex; height: calc(100vh - var(--head-h) - 38px); }

/* ═══ LEFT PANEL ═══ */
.panel-left {
  width: var(--left-w);
  min-width: var(--left-w);
  background: var(--surface);
  backdrop-filter: blur(20px);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  animation: slideRight 0.5s var(--ease-out) both;
}

.panel-left-head {
  height: 52px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  font-size: 10px;
  font-weight: 700;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 1px;
  flex-shrink: 0;
}
.col-name { flex: 1; }
.col-who { width: 90px; text-align: center; }
.col-dates { width: 105px; text-align: right; padding-right: 4px; }

.panel-left-body { flex: 1; overflow-y: auto; overflow-x: hidden; }
.panel-left-body::-webkit-scrollbar { width: 3px; }
.panel-left-body::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

.section-head {
  height: var(--row-h);
  display: flex;
  align-items: center;
  padding: 0 14px;
  background: var(--section-bg);
  backdrop-filter: blur(8px);
  font-size: 11.5px;
  font-weight: 800;
  color: var(--accent);
  cursor: pointer;
  user-select: none;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  transition: all 0.2s var(--ease);
  letter-spacing: -0.2px;
}
.section-head:hover { background: var(--hover); padding-left: 18px; }
.section-head .arrow {
  font-size: 8px;
  transition: transform 0.3s var(--ease-spring);
  opacity: 0.5;
}
.section-head.closed .arrow { transform: rotate(-90deg); }
.section-count {
  font-size: 10px;
  font-weight: 500;
  color: var(--text3);
  margin-left: auto;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--surface2);
}

.task-row {
  height: var(--row-h);
  display: flex;
  align-items: center;
  padding: 0 14px 0 24px;
  border-bottom: 1px solid var(--gantt-line);
  font-size: 12.5px;
  cursor: pointer;
  transition: all 0.2s var(--ease);
  animation: fadeUp 0.35s var(--ease-out) both;
}
.task-row:hover { background: var(--hover); padding-left: 28px; }
.task-row .col-name {
  flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-weight: 500; letter-spacing: -0.2px;
}
.task-row .col-who {
  width: 90px; text-align: center; font-size: 10px; color: var(--text3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.task-row .col-dates {
  width: 105px; text-align: right; font-size: 10.5px; color: var(--text2);
  font-weight: 600; padding-right: 4px; font-variant-numeric: tabular-nums;
}
.no-date { color: var(--text3); font-style: italic; font-weight: 400; }

/* ═══ GANTT ═══ */
.panel-right {
  flex: 1; overflow: auto; background: var(--gantt-bg); position: relative;
  transition: background 0.5s var(--ease);
}
.panel-right::-webkit-scrollbar { width: 5px; height: 5px; }
.panel-right::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }
.panel-right::-webkit-scrollbar-corner { background: transparent; }

.gantt-wrap { position: relative; min-width: max-content; min-height: 100%; }

.gantt-head {
  position: sticky; top: 0; z-index: 10;
  background: var(--surface);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
.gantt-months { display: flex; height: 26px; }
.gantt-month {
  font-size: 10px; font-weight: 800; color: var(--accent);
  text-transform: uppercase; letter-spacing: 1px;
  display: flex; align-items: center; padding-left: 12px;
  border-left: 1px solid var(--border);
}
.gantt-days { display: flex; height: 26px; }
.gantt-day {
  width: var(--day-w); min-width: var(--day-w);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 9px; color: var(--text3); border-left: 1px solid var(--gantt-line);
  transition: background 0.15s, color 0.15s;
}
.gantt-day.weekend { background: var(--weekend-bg); }
.gantt-day.today {
  background: var(--today-bg); color: var(--accent); font-weight: 800;
  position: relative;
}
.gantt-day.today::after {
  content: ''; position: absolute; bottom: 0; left: 25%; right: 25%;
  height: 2px; background: var(--accent); border-radius: 2px;
}
.gantt-day .d-num { font-weight: 700; font-size: 10px; }
.gantt-day .d-name { font-size: 7px; margin-top: 0px; letter-spacing: 0.3px; }

.gantt-body { position: relative; }
.gantt-row { height: var(--row-h); position: relative; border-bottom: 1px solid var(--gantt-line); }
.gantt-row.section-row { background: var(--section-bg); }

/* Today line */
.today-line {
  position: absolute; top: 0; bottom: 0; width: 2px;
  background: linear-gradient(180deg, var(--accent), transparent);
  z-index: 5; pointer-events: none; opacity: 0.6;
}
.today-line::before {
  content: ''; position: absolute; top: -2px; left: -5px;
  width: 12px; height: 12px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 12px var(--accent-glow);
  animation: breathe 3s ease-in-out infinite;
}

/* ═══ BARS ═══ */
.bar {
  position: absolute; top: 8px; height: 24px;
  border-radius: 7px;
  cursor: grab;
  display: flex; align-items: center;
  padding: 0 8px;
  font-size: 10px; font-weight: 700;
  color: rgba(0,0,0,0.8);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  z-index: 2;
  user-select: none;
  letter-spacing: -0.2px;
  transition: box-shadow 0.2s var(--ease), transform 0.15s var(--ease);
  transform-origin: left center;
  animation: barEnter 0.4s var(--ease-out) both;
}
.bar::after {
  content: '';
  position: absolute; inset: 0;
  border-radius: 7px;
  background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, transparent 60%);
  pointer-events: none;
}
.bar:hover {
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  z-index: 3;
  transform: translateY(-2px) scaleY(1.08);
}
.bar.dragging {
  cursor: grabbing;
  opacity: 0.95;
  box-shadow: 0 8px 28px rgba(0,0,0,0.4);
  z-index: 10;
  transform: translateY(-3px) scaleY(1.1);
}

.bar .handle { position: absolute; top: 0; width: 12px; height: 100%; cursor: ew-resize; z-index: 4; }
.bar .handle-l { left: 0; border-radius: 7px 0 0 7px; }
.bar .handle-r { right: 0; border-radius: 0 7px 7px 0; }
.bar .handle:hover { background: rgba(255,255,255,0.2); }

.clr-0{background:linear-gradient(135deg,#30d158,#1fa844)}.clr-1{background:linear-gradient(135deg,#0a84ff,#005ec4)}.clr-2{background:linear-gradient(135deg,#ff9f0a,#d68400)}.clr-3{background:linear-gradient(135deg,#bf5af2,#8f3fc0)}.clr-4{background:linear-gradient(135deg,#ff375f,#c42040)}.clr-5{background:linear-gradient(135deg,#64d2ff,#2eb5e5)}.clr-6{background:linear-gradient(135deg,#ff453a,#c4302a)}.clr-7{background:linear-gradient(135deg,#ffd60a,#c4a600)}

[data-theme="light"] .bar { color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.25); }
[data-theme="light"] .clr-7 { color: #1d1d1f; text-shadow: none; }

/* ═══ MODAL ═══ */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: var(--overlay);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  z-index: 200;
  align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; animation: fadeIn 0.25s var(--ease); }

.modal {
  background: var(--modal-bg);
  border: 1px solid var(--border2);
  border-radius: 24px;
  padding: 32px;
  width: 420px; max-width: 92vw;
  box-shadow: var(--shadow-lg);
  animation: scaleIn 0.4s var(--ease-spring);
  position: relative;
  overflow: hidden;
}
.modal::before {
  content: ''; position: absolute; top: 0; left: 15%; right: 15%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-glow), transparent);
}
.modal h3 {
  font-size: 18px; font-weight: 800; margin-bottom: 24px;
  letter-spacing: -0.5px; line-height: 1.3;
}

.field { margin-bottom: 16px; }
.field label {
  display: block; font-size: 10px; color: var(--text2);
  margin-bottom: 6px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.8px;
}
.field input, .field textarea, .field select {
  width: 100%; padding: 12px 14px;
  background: var(--input-bg);
  border: 1px solid var(--border2);
  border-radius: 12px;
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  transition: all 0.25s var(--ease);
}
.field input:focus, .field textarea:focus, .field select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-dim);
  transform: scale(1.01);
}
.field textarea { resize: vertical; min-height: 76px; }
.modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

/* ═══ TOAST ═══ */
.toast {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--surface-solid);
  border: 1px solid var(--border-glow);
  color: var(--text); padding: 12px 24px;
  border-radius: 16px; font-size: 13px; font-weight: 600;
  z-index: 300;
  transition: transform 0.5s var(--ease-spring);
  pointer-events: none;
  box-shadow: var(--shadow-md);
  backdrop-filter: blur(20px);
  letter-spacing: -0.15px;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ═══ LOADING ═══ */
.loading-screen {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 999; transition: opacity 0.6s var(--ease);
}
.loading-screen.fade-out { opacity: 0; pointer-events: none; }

.loader {
  width: 40px; height: 40px;
  position: relative;
  margin-bottom: 16px;
}
.loader-ring {
  position: absolute; inset: 0;
  border: 3px solid var(--border2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.9s cubic-bezier(0.5,0,0.5,1) infinite;
}
.loader-ring:nth-child(2) {
  inset: 6px;
  border-top-color: var(--blue);
  animation-delay: -0.15s;
  animation-duration: 1.2s;
}
.loading-text { font-size: 13px; color: var(--text2); font-weight: 600; letter-spacing: -0.2px; }

.hidden { display: none !important; }

@media(max-width:768px) {
  :root{--left-w:240px;--day-w:24px;--row-h:36px}
  .col-who{display:none}
  .col-dates{width:80px}
  .header{padding:0 14px}
  .btn span.label{display:none}
  .status-bar .hint{display:none}
}
</style>
</head>
<body data-theme="dark">

<!-- LOADING -->
<div class="loading-screen" id="loadingScreen">
  <div class="loader"><div class="loader-ring"></div><div class="loader-ring"></div></div>
  <div class="loading-text">Загрузка проекта...</div>
</div>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <div class="logo">
      <div class="logo-mark">КБ</div>
      <span>Ход работ</span>
    </div>
    <div class="badge" id="todayBadge"></div>
  </div>
  <div class="header-right">
    <div class="sync-wrap">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncText">Supabase</span>
    </div>
    <button class="btn" onclick="scrollToToday()">📍 <span class="label">Сегодня</span></button>
    <button class="btn" onclick="exportTxt()">💾 <span class="label">Экспорт</span></button>
    <a class="btn btn-supa" href="https://supabase.com/dashboard/project/vsmqzdyzjcczrogwptsq/editor" target="_blank" title="Открыть таблицу в Supabase">
      <svg width="14" height="14" viewBox="0 0 109 113" fill="none"><path d="M63.7 110.3c-2.6 3.3-8.1 1.4-8.2-2.8l-.8-36h51.3c7.4 0 11.4 8.6 6.6 14.2L63.7 110.3z" fill="#3ecf8e"/><path d="M63.7 110.3c-2.6 3.3-8.1 1.4-8.2-2.8l-.8-36h51.3c7.4 0 11.4 8.6 6.6 14.2L63.7 110.3z" fill="url(#a)" fill-opacity=".2"/><path d="M45.3 2.7C47.9-.6 53.4 1.3 53.5 5.5l.4 36H2.7c-7.4 0-11.4-8.6-6.6-14.2L45.3 2.7z" fill="#3ecf8e"/><defs><linearGradient id="a" x1="54.9" y1="84" x2="86.2" y2="100.6" gradientUnits="userSpaceOnUse"><stop stop-color="#249361"/><stop offset="1" stop-color="#3ecf8e"/></linearGradient></defs></svg>
      <span class="label">Таблица</span>
    </a>
    <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </div>
</div>

<!-- STATUS BAR -->
<div class="status-bar" id="statusBar"></div>

<!-- MAIN -->
<div class="main">
  <div class="panel-left">
    <div class="panel-left-head">
      <div class="col-name">Работа</div>
      <div class="col-who">Подрядчик</div>
      <div class="col-dates">Сроки</div>
    </div>
    <div class="panel-left-body" id="taskList"></div>
  </div>
  <div class="panel-right" id="ganttScroll">
    <div class="gantt-wrap" id="ganttWrap">
      <div class="gantt-head" id="ganttHead">
        <div class="gantt-months" id="ganttMonths"></div>
        <div class="gantt-days" id="ganttDays"></div>
      </div>
      <div class="gantt-body" id="ganttBody"></div>
      <div class="today-line" id="todayLine"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="modalTitle">Редактировать</h3>
    <div class="field"><label>Начало</label><input type="date" id="editStart"></div>
    <div class="field"><label>Окончание</label><input type="date" id="editEnd"></div>
    <div class="field"><label>Подрядчик</label><input type="text" id="editContractor"></div>
    <div class="field"><label>Примечания</label><textarea id="editNotes"></textarea></div>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal()">Отмена</button>
      <button class="btn btn-accent" onclick="saveModal()">Сохранить</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const SUPA='https://vsmqzdyzjcczrogwptsq.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzbXF6ZHl6amNjenJvZ3dwdHNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NDU3NDUsImV4cCI6MjA4ODAyMTc0NX0.qHqNNxQyzKrBbtarlLD3BKjykt9jbcW5h4UoZGF5TY8';
async function supa(path,o={}){const r=await fetch(SUPA+'/rest/v1/'+path,{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':o.prefer||'return=representation',...o.headers},method:o.method||'GET',body:o.body?JSON.stringify(o.body):undefined});if(!r.ok)throw new Error(r.statusText);const t=await r.text();return t?JSON.parse(t):null}

const T_START=new Date(2026,1,1),T_END=new Date(2026,5,30),DW=30;
const MO=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const DN=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
let sections=[],collapsed=JSON.parse(localStorage.getItem('kb_col')||'{}'),editingId=null,syncTm=null;

function pD(s){if(!s)return null;const d=new Date(s+'T00:00:00');return isNaN(d)?null:d}
function fS(d){return d?String(d.getDate()).padStart(2,'0')+'.'+(d.getMonth()+1):''}
function fI(d){return d?d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'):null}
function dD(a,b){return Math.round((b-a)/864e5)}
function dI(d){return dD(T_START,d)}
function iD(i){const d=new Date(T_START);d.setDate(d.getDate()+i);return d}
function tD(){return dD(T_START,T_END)+1}

function initTheme(){const s=localStorage.getItem('kb_theme')||'dark';document.body.dataset.theme=s;document.getElementById('themeBtn').textContent=s==='dark'?'🌙':'☀️'}
function toggleTheme(){const n=document.body.dataset.theme==='dark'?'light':'dark';document.body.dataset.theme=n;localStorage.setItem('kb_theme',n);document.getElementById('themeBtn').textContent=n==='dark'?'🌙':'☀️'}

async function loadData(){
  setSS('syncing');
  try{
    const rows=await supa('hod_rabot?order=sort_order.asc');
    sections=[];const m={};
    rows.forEach(r=>{
      if(!m[r.section_index]){m[r.section_index]={section:r.section_name,color:r.color,tasks:[]};sections.push(m[r.section_index])}
      m[r.section_index].tasks.push({id:r.id,name:r.task_name,contractor:r.contractor||'',days:r.days,start:r.start_date,end:r.end_date,notes:r.notes||''});
    });
    setSS('ok');
  }catch(e){console.error(e);setSS('error')}
}

function saveTask(t){
  setSS('syncing');clearTimeout(syncTm);
  syncTm=setTimeout(async()=>{
    try{await supa('hod_rabot?id=eq.'+t.id,{method:'PATCH',body:{start_date:t.start||null,end_date:t.end||null,days:t.days,contractor:t.contractor,notes:t.notes,updated_at:new Date().toISOString()}});setSS('ok')}
    catch(e){console.error(e);setSS('error')}
  },400);
}

function setSS(s){
  const d=document.getElementById('syncDot'),t=document.getElementById('syncText');
  d.className='sync-dot'+(s==='syncing'?' syncing':s==='error'?' error':'');
  t.textContent=s==='syncing'?'Сохраняю...':s==='error'?'Ошибка связи':'Подключено';
}

function renderHead(){
  const mE=document.getElementById('ganttMonths'),dE=document.getElementById('ganttDays');mE.innerHTML='';dE.innerHTML='';
  const tot=tD();let cM=-1,mDiv=null,mc=0;
  for(let i=0;i<tot;i++){
    const d=iD(i),m=d.getMonth();
    if(m!==cM){if(mDiv)mDiv.style.width=(mc*DW)+'px';mDiv=document.createElement('div');mDiv.className='gantt-month';mDiv.textContent=MO[m];mE.appendChild(mDiv);cM=m;mc=0}mc++;
    const dd=document.createElement('div');dd.className='gantt-day';const dow=d.getDay();
    if(dow===0||dow===6)dd.classList.add('weekend');
    if(d.toDateString()===new Date().toDateString())dd.classList.add('today');
    dd.innerHTML='<span class="d-num">'+d.getDate()+'</span><span class="d-name">'+DN[dow]+'</span>';dE.appendChild(dd);
  }
  if(mDiv)mDiv.style.width=(mc*DW)+'px';
  document.getElementById('ganttWrap').style.width=(tot*DW)+'px';
}

function render(){
  const list=document.getElementById('taskList'),body=document.getElementById('ganttBody');list.innerHTML='';body.innerHTML='';
  let tt=0,wd=0,od=0,barIdx=0;const now=new Date();now.setHours(0,0,0,0);

  sections.forEach((sec,si)=>{
    const cl=collapsed[si],twD=sec.tasks.filter(t=>t.start&&t.end).length;
    const sh=document.createElement('div');sh.className='section-head'+(cl?' closed':'');
    sh.innerHTML='<span class="arrow">▼</span>'+sec.section+'<span class="section-count">'+twD+'/'+sec.tasks.length+'</span>';
    sh.onclick=()=>{collapsed[si]=!collapsed[si];localStorage.setItem('kb_col',JSON.stringify(collapsed));render()};
    list.appendChild(sh);
    const gr=document.createElement('div');gr.className='gantt-row section-row';body.appendChild(gr);
    if(cl)return;

    sec.tasks.forEach((t,ti)=>{
      tt++;const sD=pD(t.start),eD=pD(t.end);if(sD&&eD)wd++;if(eD&&eD<now&&sD)od++;
      const tr=document.createElement('div');tr.className='task-row';
      tr.style.animationDelay=(ti*0.03)+'s';
      tr.dataset.id=t.id;
      const ds=sD&&eD?fS(sD)+' → '+fS(eD):'';
      tr.innerHTML='<div class="col-name">'+t.name+'</div><div class="col-who">'+t.contractor+'</div><div class="col-dates">'+(ds||'<span class="no-date">'+(t.notes?t.notes.substring(0,14):'—')+'</span>')+'</div>';
      tr.ondblclick=()=>openModal(t.id);list.appendChild(tr);

      const row=document.createElement('div');row.className='gantt-row';row.dataset.id=t.id;
      if(sD&&eD){
        barIdx++;
        const l=dI(sD)*DW,w=(dD(sD,eD)+1)*DW;
        const bar=document.createElement('div');bar.className='bar clr-'+sec.color;
        bar.style.left=l+'px';bar.style.width=Math.max(w,DW)+'px';
        bar.style.animationDelay=(barIdx*0.04)+'s';
        bar.title=t.name+'\n'+fS(sD)+' — '+fS(eD)+(t.notes?'\n'+t.notes:'');
        bar.textContent=w>80?t.name:'';bar.dataset.id=t.id;
        const hl=document.createElement('div');hl.className='handle handle-l';
        const hr=document.createElement('div');hr.className='handle handle-r';
        bar.appendChild(hl);bar.appendChild(hr);
        bar.ondblclick=(e)=>{e.stopPropagation();openModal(t.id)};
        setupDrag(bar,t);setupResize(hl,bar,t,'left');setupResize(hr,bar,t,'right');
        row.appendChild(bar);
      }
      body.appendChild(row);
    });
  });
  renderTL();renderStat(tt,wd,od);
}

function renderStat(t,d,o){
  document.getElementById('statusBar').innerHTML=
    '<div class="stat"><span class="stat-num">'+t+'</span> задач</div>'+
    '<div class="stat-divider"></div>'+
    '<div class="stat"><div class="stat-dot" style="background:var(--accent)"></div><span class="stat-num">'+d+'</span> запланировано</div>'+
    '<div class="stat-divider"></div>'+
    '<div class="stat"><div class="stat-dot" style="background:var(--text3)"></div><span class="stat-num">'+(t-d)+'</span> без дат</div>'+
    (o>0?'<div class="stat-divider"></div><div class="stat"><div class="stat-dot" style="background:var(--red)"></div><span class="stat-num">'+o+'</span> просрочено</div>':'')+
    '<div class="stat hint" style="margin-left:auto;color:var(--text3);font-style:italic">Тяни полоски для смены сроков · Двойной клик = редактирование</div>';
}

function renderTL(){
  const l=document.getElementById('todayLine'),n=new Date(),i=dI(n);
  if(i<0||i>tD()){l.style.display='none';return}
  l.style.display='block';l.style.left=(i*DW+DW/2)+'px';
}

function setupDrag(bar,task){
  bar.addEventListener('mousedown',(e)=>{
    if(e.target.classList.contains('handle'))return;e.preventDefault();bar.classList.add('dragging');
    const sx=e.clientX,oL=parseInt(bar.style.left),oS=pD(task.start),oE=pD(task.end);
    const mv=(e2)=>{const sh=Math.round((e2.clientX-sx)/DW);bar.style.left=(oL+sh*DW)+'px';const ns=new Date(oS);ns.setDate(ns.getDate()+sh);const ne=new Date(oE);ne.setDate(ne.getDate()+sh);task.start=fI(ns);task.end=fI(ne);uR(task.id,ns,ne)};
    const up=()=>{bar.classList.remove('dragging');document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);const s=pD(task.start),e=pD(task.end);if(s&&e)task.days=dD(s,e)+1;saveTask(task);showToast('✓ Сроки обновлены')};
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  });
}

function setupResize(h,bar,task,side){
  h.addEventListener('mousedown',(e)=>{
    e.preventDefault();e.stopPropagation();bar.classList.add('dragging');
    const sx=e.clientX,oL=parseInt(bar.style.left),oW=parseInt(bar.style.width),oS=pD(task.start),oE=pD(task.end);
    const mv=(e2)=>{const sh=Math.round((e2.clientX-sx)/DW);
      if(side==='left'){const nw=oW-sh*DW;if(nw<DW)return;bar.style.left=(oL+sh*DW)+'px';bar.style.width=nw+'px';const ns=new Date(oS);ns.setDate(ns.getDate()+sh);task.start=fI(ns);uR(task.id,ns,pD(task.end))}
      else{const nw=oW+sh*DW;if(nw<DW)return;bar.style.width=nw+'px';const ne=new Date(oE);ne.setDate(ne.getDate()+sh);task.end=fI(ne);uR(task.id,pD(task.start),ne)}
    };
    const up=()=>{bar.classList.remove('dragging');document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);const s=pD(task.start),en=pD(task.end);if(s&&en)task.days=dD(s,en)+1;saveTask(task);showToast('✓ Сроки обновлены')};
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  });
}

function uR(id,s,e){const r=document.querySelector('.task-row[data-id="'+id+'"]');if(!r)return;const d=r.querySelector('.col-dates');if(s&&e)d.textContent=fS(s)+' → '+fS(e)}
function findTask(id){for(const s of sections)for(const t of s.tasks)if(t.id===id)return t;return null}

function openModal(id){
  const t=findTask(id);if(!t)return;editingId=id;
  document.getElementById('modalTitle').textContent=t.name;
  document.getElementById('editStart').value=t.start||'';
  document.getElementById('editEnd').value=t.end||'';
  document.getElementById('editContractor').value=t.contractor||'';
  document.getElementById('editNotes').value=t.notes||'';
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');editingId=null}
function saveModal(){
  const t=findTask(editingId);if(!t)return;
  t.start=document.getElementById('editStart').value||null;
  t.end=document.getElementById('editEnd').value||null;
  t.contractor=document.getElementById('editContractor').value;
  t.notes=document.getElementById('editNotes').value;
  const s=pD(t.start),e=pD(t.end);if(s&&e)t.days=dD(s,e)+1;
  saveTask(t);closeModal();render();showToast('✓ Задача сохранена');
}

function setupSync(){
  const l=document.querySelector('.panel-left-body'),r=document.getElementById('ganttScroll');let lk=false;
  l.addEventListener('scroll',()=>{if(lk)return;lk=true;r.scrollTop=l.scrollTop;lk=false});
  r.addEventListener('scroll',()=>{if(lk)return;lk=true;l.scrollTop=r.scrollTop;lk=false});
}
function scrollToToday(){const i=dI(new Date()),el=document.getElementById('ganttScroll');el.scrollTo({left:Math.max(0,i*DW-el.clientWidth/3),behavior:'smooth'})}

function exportTxt(){
  let t='ХОД РАБОТ — КОРОЛЕВСКИЕ БАНИ\nЭкспорт: '+new Date().toLocaleDateString('ru-RU')+'\n\n';
  sections.forEach(s=>{t+=s.section+'\n';s.tasks.forEach(tk=>{t+='  '+tk.name+' | '+(tk.contractor||'—')+' | '+(tk.start||'—')+' → '+(tk.end||'—')+(tk.notes?' | '+tk.notes:'')+'\n'});t+='\n'});
  const b=new Blob([t],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ход_работ.txt';a.click();showToast('💾 Файл скачан');
}

function showToast(m){const t=document.getElementById('toast');t.innerHTML=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2500)}

;(async()=>{
  initTheme();
  const n=new Date();
  document.getElementById('todayBadge').textContent=n.getDate()+' '+MO[n.getMonth()].toLowerCase()+' '+n.getFullYear();
  renderHead();await loadData();render();setupSync();
  const ls=document.getElementById('loadingScreen');ls.classList.add('fade-out');setTimeout(()=>ls.remove(),600);
  setTimeout(scrollToToday,300);
})();
</script>
</body>
</html>
